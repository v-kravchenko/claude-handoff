name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck skills/handoff/handoff.sh install.sh tests/test.sh
      - name: python syntax
        run: python3 -c 'import ast, sys; ast.parse(open(sys.argv[1]).read())' bin/handoffs
      - name: validate JSON
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: bash version
        run: bash --version | head -n 1
      - name: tests
        run: tests/test.sh
